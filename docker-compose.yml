services:
  postgres:
    image: postgres:16-alpine
    container_name: card2leads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-card2leads}
      POSTGRES_USER: ${POSTGRES_USER:-card2leads}
      # Password comes from your .env file (never committed). Compose refuses to
      # start if it is not set, so the database is never created with a blank/weak one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      # Bind to localhost ONLY. The database is not reachable from the internet;
      # only the app on this same server can connect to it.
      - "127.0.0.1:55432:5432"
    volumes:
      - card2leads_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-card2leads} -d ${POSTGRES_DB:-card2leads}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  card2leads_postgres_data:
